name: Build and Test

on:
  workflow_call:
    inputs:
      opendaq-ref:
        description: "openDAQ commit, branch or tag. If empty, uses the opendaq_ref file from the repo."
        type: string
        default: ''
      exclude-presets:
        description: "JSON array of wildcard patterns to exclude presets, e.g. '[\"ci-*-macos-latest-*\", \"ci-test-*\"]'"
        type: string
        default: '[]'
      packages:
        description: 'JSON array of package requests, e.g. [{"packages": {"apt": ["libpcap-dev"]}}]'
        type: string
        default: '[]'

jobs:
  generate:
    name: Generate matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.filter-jobs.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4

      - name: List available presets
        id: presets
        shell: bash
        run: |
          cmake_presets=$(cmake --build --list-presets 2>/dev/null | grep '^ ' | sed 's/^ *"//;s/".*$//' | tr '\n' ' ')
          ctest_presets=$(ctest --list-presets 2>/dev/null | grep '^ ' | sed 's/^ *"//;s/".*$//' | tr '\n' ' ')
          echo "cmake=$cmake_presets" >> $GITHUB_OUTPUT
          echo "ctest=$ctest_presets" >> $GITHUB_OUTPUT

      - name: Filter jobs to run
        id: filter-jobs
        shell: python3 {0}
        run: |
          import json, os
          from fnmatch import fnmatch

          available_cmake_presets = set("""${{ steps.presets.outputs.cmake }}""".split())
          available_ctest_presets = set("""${{ steps.presets.outputs.ctest }}""".split())

          exclude_presets = json.loads("""${{ inputs.exclude-presets }}""")

          user_packages = json.loads("""${{ inputs.packages }}""")

          default_packages = [
              {
                  "preset-pattern": "ci-build-ubuntu-latest-*",
                  "packages": {
                      "apt": [
                          "mono-runtime",
                          "libmono-system-json-microsoft4.0-cil",
                          "libmono-system-data4.0-cil",
                      ],
                  },
              },
          ]

          pm_cmds = {
              "apt": "sudo apt-get update && sudo apt-get install -y --no-install-recommends",
              "brew": "brew install",
              "choco": "choco install -y",
          }

          jobs_matrix = [
              {"runner": "ubuntu-latest",  "cmake-preset": "ci-build-ubuntu-latest-release",  "ctest-preset": "ci-test-ubuntu-latest-release"},
              {"runner": "ubuntu-latest",  "cmake-preset": "ci-build-ubuntu-latest-debug",    "ctest-preset": "ci-test-ubuntu-latest-debug"},
              {"runner": "macos-latest",   "cmake-preset": "ci-build-macos-latest-release",   "ctest-preset": "ci-test-macos-latest-release"},
              {"runner": "macos-latest",   "cmake-preset": "ci-build-macos-latest-debug",     "ctest-preset": "ci-test-macos-latest-debug"},
              {"runner": "windows-latest", "cmake-preset": "ci-build-windows-latest-release", "ctest-preset": "ci-test-windows-latest-release"},
              {"runner": "windows-latest", "cmake-preset": "ci-build-windows-latest-debug",   "ctest-preset": "ci-test-windows-latest-debug"},
          ]

          def matches_any(name: str, patterns: list[str]) -> bool:
              return any(fnmatch(name, p) for p in patterns)

          def build_install_cmd(pm: str, packages: dict[str, list[str]]) -> str:
              pkgs = packages.get(pm, [])
              if not pkgs or pm not in pm_cmds:
                  return ""
              return f"{pm_cmds[pm]} {' '.join(pkgs)}"

          matrix = []
          for job_cfg in jobs_matrix:
              cmake_preset = job_cfg["cmake-preset"]
              ctest_preset = job_cfg.get("ctest-preset", "")

              # skip if build preset not available or excluded
              if cmake_preset not in available_cmake_presets:
                  continue
              if matches_any(cmake_preset, exclude_presets):
                  continue

              # merge packages: defaults + user
              packages: dict[str, list[str]] = {}
              for req in default_packages + user_packages:
                  if not matches_any(cmake_preset, [req.get("preset-pattern", "*")]):
                      continue
                  for pm, pkgs in req.get("packages", {}).items():
                      packages.setdefault(pm, []).extend(pkgs)

              # skip test if ctest preset not available or excluded
              if ctest_preset and (ctest_preset not in available_ctest_presets or matches_any(ctest_preset, exclude_presets)):
                  ctest_preset = ""

              matrix_job = {
                  "name": f"{job_cfg['runner']} / {cmake_preset}",
                  "runner": job_cfg["runner"],
                  "cmake-preset": cmake_preset,
                  "ctest-preset": ctest_preset,
                  "cmd-install-apt": build_install_cmd("apt", packages),
                  "cmd-install-brew": build_install_cmd("brew", packages),
                  "cmd-install-choco": build_install_cmd("choco", packages),
              }

              matrix.append(matrix_job)

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"matrix={json.dumps({'include': matrix})}\n")

  build:
    needs: generate
    if: ${{ needs.generate.outputs.matrix != '' }}
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.generate.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v4

      - name: Override opendaq_ref
        if: ${{ inputs.opendaq-ref != '' }}
        shell: bash
        run: echo "${{ inputs.opendaq-ref }}" > opendaq_ref

      - name: Install dependencies (apt)
        if: matrix.cmd-install-apt != ''
        run: ${{ matrix.cmd-install-apt }}

      - name: Install dependencies (brew)
        if: matrix.cmd-install-brew != ''
        run: ${{ matrix.cmd-install-brew }}

      - name: Install dependencies (choco)
        if: matrix.cmd-install-choco != ''
        run: ${{ matrix.cmd-install-choco }}

      - name: Configure
        run: cmake --preset ${{ matrix.cmake-preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.cmake-preset }}

      - name: Test
        if: matrix.ctest-preset != ''
        run: ctest --preset ${{ matrix.ctest-preset }}
